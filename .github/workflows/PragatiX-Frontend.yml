name: PragatiX-Frontend
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint > actionlint-output.txt || true
          node .ci/normalize.cjs actionlint actionlint-output.txt findings
      - uses: actions/upload-artifact@v4
        with:
          name: actionlint
          path: findings/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit > tsc-output.txt 2>&1 || true
      - run: npm run build > vite-build-output.txt 2>&1 || true
      - run: node .ci/normalize.cjs typescript tsc-output.txt findings
      - run: node .ci/normalize.cjs vitebuild vite-build-output.txt findings
      - run: node .ci/normalize.cjs bundlesize "" findings
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: findings/

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx oxlint --format=json > oxlint-output.json || true
      - run: node .ci/normalize.cjs oxlint oxlint-output.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: code-quality
          path: findings/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage || true
      - run: node .ci/normalize.cjs vitest findings/test-report.json findings
      - run: node .ci/normalize.cjs coverage coverage/coverage-final.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: findings/

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif || true
          node .ci/normalize.cjs semgrep semgrep.sarif findings
      - uses: actions/upload-artifact@v4
        with:
          name: sast
          path: findings/

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
      - name: Normalize CodeQL SARIF
        run: |
          SARIF_FILE=$(find codeql-results -name "*.sarif" | head -n 1)
          node .ci/normalize.cjs codeql "$SARIF_FILE" findings
      - uses: actions/upload-artifact@v4
        with:
          name: codeql
          path: findings/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --report-path gitleaks.json --exit-code 0 || true
          node .ci/normalize.cjs gitleaks gitleaks.json findings
      - name: Vite Env Leak Check
        run: |
          node .ci/check-vite-env.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: secrets
          path: findings/

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --json > npm-audit.json || true
      - run: node .ci/normalize.cjs npmaudit npm-audit.json findings
      - run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format json -o trivy.json . || true
          node .ci/normalize.cjs trivy trivy.json findings
      - run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft . -o cyclonedx-json=sbom.cdx.json || true
          node .ci/normalize.cjs syft sbom.cdx.json findings
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom.cdx.json --output json > grype.json || true
          node .ci/normalize.cjs grype grype.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: sca
          path: findings/

  sast-eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save eslint eslint-plugin-security eslint-plugin-react-hooks eslint-plugin-jsx-a11y
          npx eslint -c eslint.security.config.mjs --format json --output-file eslint-security-output.json . || true
          node .ci/normalize.cjs eslint eslint-security-output.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: sast-eslint
          path: findings/

  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        continue-on-error: true
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: false
      - name: Normalize Scorecard
        run: node .ci/normalize.cjs scorecard scorecard-results.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: findings/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test || true
      - name: Normalize Playwright
        run: node .ci/normalize.cjs playwright playwright-report/results.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: findings/
          if-no-files-found: ignore

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > vite-preview.log 2>&1 &
          sleep 5
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://127.0.0.1:4173
          cmd_options: "-j -J zap-report.json"
      - name: Normalize ZAP
        run: node .ci/normalize.cjs zap zap-report.json findings
      - uses: actions/upload-artifact@v4
        with:
          name: dast
          path: findings/
          if-no-files-found: ignore

  pr-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit Message Lint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .ci/commitlint.config.mjs
      - name: PR Title Lint
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm outdated
        run: |
          npm outdated --json > npm-outdated.json || true
          node .ci/normalize.cjs deps npm-outdated.json findings
      - name: Create Dependabot-style PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): apply dependency updates'
          branch: 'dependabot/npm-dependency-updates'
          delete-branch: true
          title: 'chore(deps): automated dependency updates'
          labels: 'dependencies, security'
          body: |
            Automated dependency update PR generated by the PragatiX-Frontend pipeline.
            This replaces the separate `.github/dependabot.yml` configuration.
          add-paths: |
            package.json
            package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-updates
          path: findings/
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    needs: [lint-workflows, build, code-quality, test, sast, codeql, secrets, sca, sast-eslint, scorecard, e2e, dast, dependency-updates]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # pin v4.1.8 to resolve GHSA-cxww-7g56-2vh6
        with:
          path: findings-download/
      - run: |
          mkdir -p findings
          find findings-download -name "*.json" -exec cp {} findings/ \;
      - run: |
          node .ci/render_report.cjs \
            findings/ \
            .ci/templates/report.html \
            final-security-report.html \
            gate-result.json \
            "${{ github.repository }}" \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}" \
            "${{ github.run_number }}" \
            "${{ github.actor }}" \
            "${{ github.event_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: gate-result
          path: gate-result.json

  gate:
    runs-on: ubuntu-latest
    needs: report
    if: always()
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # pin v4.1.8 to resolve GHSA-cxww-7g56-2vh6
        with:
          name: gate-result
      - name: Evaluate Security Gate
        run: |
          PASS=$(node -e "console.log(JSON.parse(fs.readFileSync('gate-result.json', 'utf8')).pass)")
          SCORE=$(node -e "console.log(JSON.parse(fs.readFileSync('gate-result.json', 'utf8')).score)")
          REASONS=$(node -e "console.log(JSON.parse(fs.readFileSync('gate-result.json', 'utf8')).reasons.join('\n'))")
          echo "Security Gate Score: $SCORE/100"
          if [ "$PASS" != "true" ]; then
            echo "Security Gate FAILED!"
            echo "Reasons:"
            echo "$REASONS"
            exit 1
          else
            echo "Security Gate PASSED!"
          fi
